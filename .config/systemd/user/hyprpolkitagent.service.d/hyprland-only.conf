[Unit]
# KDE already runs polkit-kde-agent. The vendor hyprpolkitagent unit only
# checks WAYLAND_DISPLAY, which Plasma also sets, so the agent starts in KDE,
# crashes, and stays failed. triage-watch then alerts every minute.
# Skip the unit unless this is actually a Hyprland session.
ConditionEnvironment=HYPRLAND_INSTANCE_SIGNATURE
