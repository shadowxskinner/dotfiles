# Midnight-PC Hyprland baseline.
# KDE remains the default/fallback session; select Hyprland from SDDM to test.

monitor = DP-3, 3840x2160@165, 0x0, 1.5
# Remember the portrait display layout when HDMI-A-1 is connected.
monitor = HDMI-A-1, 1920x1080@60, 2560x-780, 1, transform, 3

$terminal = kitty
$fileManager = dolphin
$menu = ~/.local/bin/wofi-toggle

exec-once = playerctld
exec-once = dms run
exec-once = systemctl --user start hyprpolkitagent
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP XDG_SESSION_TYPE HYPRLAND_INSTANCE_SIGNATURE GTK_THEME QT_QPA_PLATFORMTHEME
exec-once = systemctl --user restart gaming-mode-watch.service
exec-once = gsettings set org.gnome.desktop.interface color-scheme prefer-dark
exec-once = gsettings set org.gnome.desktop.interface clock-format 12h
exec-once = ~/.local/bin/hypr-theme-apply
exec = ~/.local/bin/hypr-theme-apply

env = XCURSOR_SIZE, 24
env = HYPRCURSOR_SIZE, 24
env = GTK_THEME, Adwaita:dark
env = QT_QPA_PLATFORMTHEME, kde

general {
    gaps_in = 5
    gaps_out = 8
    border_size = 2
    col.active_border = rgba(5a5a5fee)
    col.inactive_border = rgba(595959aa)
    resize_on_border = true
    allow_tearing = false
    layout = dwindle
}

decoration {
    rounding = 16
    active_opacity = 0.78
    inactive_opacity = 0.68
    fullscreen_opacity = 1.0

    shadow {
        enabled = true
        range = 4
        render_power = 3
        color = rgba(1a1a1aee)
    }

    blur {
        enabled = true
        size = 12
        passes = 4
        ignore_opacity = true
        new_optimizations = true
        xray = false
        vibrancy = 0.4
        vibrancy_darkness = 0.15
        contrast = 0.9
        brightness = 0.8
        noise = 0.015
        popups = true
        popups_ignorealpha = 0.2
        special = true
    }
}

animations {
    enabled = true
    bezier = smooth, 0.23, 1, 0.32, 1
    animation = windows, 1, 5, smooth
    animation = fade, 1, 4, smooth
    animation = workspaces, 1, 4, smooth, fade
}

misc {
    # QD-OLED FreeSync Premium Pro. 1 = always, 2 = fullscreen only.
    # 1 caused visible desktop flicker on this panel: idle desktop frame pacing
    # swings the refresh rate and OLED brightness shifts with it. 2 keeps the
    # desktop at fixed refresh and gives VRR only to fullscreen games.
    vrr = 2
    force_default_wallpaper = 1
    disable_hyprland_logo = true
}

# wofi is a layer-shell surface, not a window. windowrules do not apply.
layerrule {
    name = wofi-chrome
    match:namespace = wofi
    blur = true
    ignore_alpha = 0.05
    animation = popin
    dim_around = true
}

layerrule {
    name = waybar-chrome
    match:namespace = waybar
    blur = true
    ignore_alpha = 0.05
}

input {
    kb_layout = us
    follow_mouse = 1
    sensitivity = 0
}

$mainMod = SUPER

# HE68 Mag is 65%: no Print Screen, no F-row, no media keys.
# Stay in Windows mode (physical Win/Mac switch, or Fn+W). Mac mode makes Super
# arrive as Alt and every bind below goes dead.
bind = $mainMod, RETURN, exec, $terminal
bind = $mainMod, SPACE, exec, $menu
bind = ALT, SPACE, exec, $menu
bind = $mainMod, E, exec, $fileManager
bind = $mainMod, Q, killactive
bind = $mainMod, W, killactive
bind = $mainMod SHIFT, Q, exit
bind = $mainMod SHIFT, V, togglefloating
bind = $mainMod, F, fullscreen

bind = $mainMod, T, exec, ~/.local/bin/theme-menu
bind = $mainMod, period, exec, ~/.local/bin/theme-cycle next
bind = $mainMod, comma, exec, ~/.local/bin/theme-cycle prev
bind = $mainMod, apostrophe, exec, ~/.local/bin/theme-mode auto
bind = $mainMod, G, exec, ~/.local/bin/gaming-mode toggle
bind = $mainMod, K, exec, ~/.local/bin/session-switch menu

# P = picture. The HE68 has no Print key; keep Print anyway in case Fn is remapped.
bind = $mainMod, P, exec, grim -g "$(slurp)" "$HOME/Pictures/Screenshot_$(date +%Y%m%d_%H%M%S).png"
bind = $mainMod SHIFT, P, exec, grim "$HOME/Pictures/Screenshot_$(date +%Y%m%d_%H%M%S).png"
bind = , Print, exec, grim "$HOME/Pictures/Screenshot_$(date +%Y%m%d_%H%M%S).png"
bind = SHIFT, Print, exec, grim -g "$(slurp)" "$HOME/Pictures/Screenshot_$(date +%Y%m%d_%H%M%S).png"

bindel = $mainMod, equal, exec, wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+
bindel = $mainMod, minus, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bind = $mainMod, M, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindel = , XF86AudioRaiseVolume, exec, wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+
bindel = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindel = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindel = , XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle

bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

bind = $mainMod, S, togglespecialworkspace, magic
bind = $mainMod SHIFT, S, movetoworkspace, special:magic
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow
